name: Android APK Compiler (InstantNote Cloud)

on:
  push:
    branches: [ "main", "master", "apk-forge-build" ]
    paths:
      - 'uploads/project.zip'
      - '.github/workflows/apk-forge-compiler.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded Project ZIP
        run: |
          mkdir -p workspace_src
          unzip -o uploads/project.zip -d workspace_src
          cd workspace_src
          if [ ! -f "gradlew" ] && [ -d "$(ls -d */ | head -n 1)" ]; then
            mv $(ls -d */ | head -n 1)* . || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Debug APK
        working-directory: ./workspace_src
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk-debug
          path: workspace_src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error